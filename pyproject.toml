[project]
name = "workout-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "estebancas", email = "estcascor94@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
workout-coach = "workout_coach:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
